{extend name="foxcms" /}

{block name="css"}
<style>
	.foxui-dialog__wrapper .foxui-dialog__body{
		max-height: 520px;
		overflow-y: auto;
		padding-top: 10px !important;
		padding-bottom: 10px !important;
	}
</style>
{/block}

{block name="body"}
<input name="bcid" value="{$bcid}" type="hidden" />
<input name="columnId" value="{$cid}" type="hidden" />
<div class="foxcms-content-inner">
	<!-- page content -->
	<div class="diy-form-content">
		<div class="content-top-operation">
			<div class="left">
				<a href="{:url('add')}?type=1&columnId={$clickId}">
					<button class="foxui-size-small foxui-solid-primary">
						<i class="foxui-icon-jiahao-o"></i>
						<span>批量新增</span>
					</button>
				</a>
			</div>
			<div class="right display-flex">
				<div class="foxui-input-group item-input margin-right-20">
					<div class="foxui-input-prepend">
						<input class="foxui-size-small" placeholder="请输入关键字" required value="" name="keyword"/>
					</div>
				</div>
				<button class="foxui-solid-primary foxui-size-small search-btn">搜索</button>
			</div>
		</div>
		<div class="section section-panel margin-top-10">
			<div class="foxui-table foxui-table-border-bottom foxui-table-hover foxui-checkbox-group">

				<ul class="foxui-table-thead foxui-checkbox-head">
					<li class="foxui-table-tr">
						<div class="foxui-table-th" style="flex: initial; width: 40px">
							<div class="foxui-checkbox foxui-checkbox-all">
                                <span class="foxui-checkbox-input">
                                    <i class="foxui-checkbox-icon"></i>
                                    <input type="checkbox" value="" />
                                </span>
							</div>
						</div>
						<div class="foxui-table-th">ID</div>
						<div class="foxui-table-th">标签组</div>
						<div class="foxui-table-th">标签</div>
						<div class="foxui-table-th">点击数</div>
						<div class="foxui-table-th">文档数</div>
						<div class="foxui-table-th">设为常用</div>
						<div class="foxui-table-th">新增时间</div>
						<div class="foxui-table-th">操作</div>
					</li>
				</ul>

				<ul class="foxui-table-tbody foxui-checkbox-list loading-container" id="loadingContainer">

					<!--表格内容-->

				</ul>

				<div class="table-footer foxui-checkbox-head">
					<div class="left display-flex foxui-align-items-center">
						<div class="foxui-checkbox foxui-checkbox-all margin-right-24">
                            <span class="foxui-checkbox-input">
                                <i class="foxui-checkbox-icon"></i>
                                <input type="checkbox" value="" />
                            </span>
						</div>

						<div class="display-flex">
							<button class="foxui-plain-info foxui-size-mini enable-btn">
								<i class="foxui-icon-zhengque-o"></i>
								<span>常用</span>
							</button>
							<button class="foxui-plain-info foxui-size-mini disabled-btn">
								<i class="foxui-icon-jinyong-o"></i>
								<span>不常用</span>
							</button>
							<button class="foxui-plain-info foxui-size-mini delete-btn">
								<i class="foxui-icon-shanchu-o"></i>
								<span>删除</span>
							</button>
						</div>
					</div>
					<div class="right total">共N条记录</div>
				</div>
			</div>

		</div>
	</div>
</div>

{include file="footed-copy"/}
{/block}


{block name="js"}
<script>

	/**
	 * 初始化数据
	 */
	function init(){
		let keyword = $('input[name="keyword"]').val();
		let bcid = $("input[name='bcid']").val()
		let searchData = {
			"keyword": keyword,
			"bcid": bcid
		};

		$.ajax({
			type: "post",
			url: "index",
			dataType: "json",
			data: searchData,
			success: function (res) {
				if (res.code == 1 && res.data) {
					let data = res.data;
					let paginationData = {
						pageSize: data.per_page,
						total: data.total,
						currentPage: data.current_page
					};
					initTable(paginationData, data.data);
				}
				$('#loadingContainer').removeClass('loading-container');
			}, error: function (res) {
				$('#loadingContainer').removeClass('loading-container');
			}
		});
	}

	/**
	 * @description: 初始化表格
	 * @param {*} pageSize
	 * @param {*} total
	 * @param {*} currentPage
	 * @param {*} dataList
	 * @return {*}
	 * @Date: 2022-01-12 10:55:11
	 */
	function initTable({ pageSize, total, currentPage }, dataList) {
		if (dataList == undefined){
			dataList = [];
		}
		if(total == undefined){
			total = 0;
		}
		// 追加表格 html
		_appendToTable(dataList);
		//总数
		$(".right.total").empty().html("共" + total + "条记录");
	}

	/**
	 * @description: 追加表格 html
	 * @param {*} dataList
	 * @return {*}
	 * @Date: 2022-01-12 00:18:40
	 */
	function _appendToTable(dataList) {
		const html = _trsHtml(dataList);
		$('.foxui-table-tbody').empty().append(html);
	}

	/**
	 * @description: 表格 html
	 * @param {*} dataList
	 * @return {*}
	 * @Date: 2022-01-12 00:18:52
	 */
	function _trsHtml(dataList) {
		let htmlArr = [];
		dataList.forEach(item => {
			htmlArr.push(`
            <li class="foxui-table-tr">
                <div class="foxui-table-td" style="flex: initial; width: 40px">
                    <div class="foxui-checkbox">
                        <span class="foxui-checkbox-input">
                            <i class="foxui-checkbox-icon"></i>
                            <input type="checkbox" value=""/>
                        </span>
                    </div>
                </div>
                <div class="foxui-table-td">${item.id}</div>
                <div class="foxui-table-td">${item.taggroupname}</div>
                <div class="foxui-table-td blue-color">${item.name}</div>
                <div class="foxui-table-td">${item.click}</div>
                <div class="foxui-table-td"><span style="cursor: pointer; width: 20px;" onclick="associateData(${item.id})">${item.document_num}</span></div>
                <div class="foxui-table-td">
					<span class="${item.is_used == 1?'state-enable':'state-disabled'}">${item.usedtext}</span>
                </div>
                <div class="foxui-table-td">${item.create_time}</div>
                <div class="foxui-table-td">
                    <button class="foxui-text-primary foxui-size-medium edit-btn"  id="${item.id}" onclick="associateItem(this)">关联</button>
                    <button class="foxui-text-primary foxui-size-medium edit-btn"  id="${item.id}" onclick="editItem(this)">编辑</button>
                    <button class="foxui-text-primary foxui-size-medium delete-btn" id="${item.id}" title="${item.name}"  onclick="deleteItem(this)">删除</button>
                </div>
            </li>
        `);
		});
		return htmlArr.join('');
	}

	init();

	//搜索
	$(".search-btn").on('click', function() {
		$('#loadingContainer').addClass('loading-container');
		init();
	});

	//重置
	$("button[name='reset']").on('click', function() {
		$('input[name="status"]').val("");
		$('input[name="keyword"]').val("");
	});

	//编辑
	function editItem(obj){
		let id = $(obj).attr("id");
		let columnId = $("input[name='columnId']").val();
		window.location.href = `edit?type=1&columnId=${columnId}&id=${id}`;
	}

	//关联
	function associateItem(obj) {
		let id = $(obj).attr("id");
		let columnId = $("input[name='columnId']").val();
		window.location.href = `associate?type=1&columnId=${columnId}&id=${id}`;
	}

	//单向删除
	function deleteItem(obj) {
		let title = $(obj).attr("title");
		let id = $(obj).attr("id");
		foxui.dialog({
			title: '删除',
			content: '您确定要删除【' + title + '】吗',
			cancelText: '取消',
			confirmText: '删除',
			buttonType: 'danger',
			confirm: function(callback) {
				$.ajax({
					type: "get",
					url: 'delete?id=' + id,
					dataType: "json",
					success: function(res) {
						if (res.code == 1) {
							foxui.message({
								text: res.msg,
								type: 'success',
							});
							init();
						} else {
							foxui.message({
								text: res.msg,
								type: 'warning',
							});
						}
					},
					error: function(res) {
						foxui.message({
							text: res.msg,
							type: 'info',
						});
					}
				});

				callback();
			},
			cancel: function() {
				foxui.message({
					text: '取消删除',
					type: 'info'
				});
			},
		});

	}

	// 多选删除
	$('.table-footer .delete-btn').click(function () {
		let $isChecked = $('.foxui-table-td .foxui-checkbox.is-checked'),
				$checkedTr = $isChecked.closest('.foxui-table-tr'),
				len = $isChecked.length,
				idList = [];

		if (len < 1) {
			foxui.message({
				text: '请先选译要删除的数据！',
				type: 'danger',
			});
		} else {
			foxui.dialog({
				title: '确认',
				content: '您确定要删除选中的所有数据吗？',
				confirmText: '删除',
				cancelText: '取消',
				buttonType: 'danger',
				buttonSize: 'small',
				confirm: function (callback) {
					// 异步删除数据
					$checkedTr.each(function () {
						let id = $(this).find('.foxui-table-td:nth-child(2)').text();
						idList.push(id);
					});
					$.ajax({
						type: "post",
						url: 'deletes',
						dataType: "json",
						data: {
							"idList": JSON.stringify(idList)
						},
						success: function(res) {
							if (res.code == 1) {
								foxui.message({
									text: res.msg,
									type: 'success',
								});

								init();
							}else{
								foxui.message({
									text: res.msg,
									type: 'warning',
								});
							}
						},
						error: function(res) {
							foxui.message({
								text: res.msg,
								type: 'warning',
							});
						}
					});
					callback();
				},
			});
		}
	});

	//启用所有
	$('.table-footer .enable-btn').click(function () {
		let $isChecked = $('.foxui-table-td .foxui-checkbox.is-checked'),
				$checkedTr = $isChecked.closest('.foxui-table-tr'),
				len = $isChecked.length,
				idList = [];

		if (len < 1) {
			foxui.message({
				text: '请先选译要启用的数据！',
				type: 'danger',
			});
		} else {
			foxui.dialog({
				title: '确认',
				content: '您确定要设置选中的所有数据吗？',
				confirmText: '启用',
				cancelText: '取消',
				buttonType: 'danger',
				buttonSize: 'small',
				confirm: function (callback) {
					// 异步删除数据
					$checkedTr.each(function () {
						let id = $(this).find('.foxui-table-td:nth-child(2)').text();
						idList.push(id);
					});
					$.ajax({
						type: "post",
						url: 'updateStatus',
						dataType: "json",
						data: {
							"idList": JSON.stringify(idList),
							"is_used":1
						},
						success: function(res) {
							if (res.code == 1) {
								foxui.message({
									text: res.msg,
									type: 'success',
								});

								init();
							}else{
								foxui.message({
									text: res.msg,
									type: 'warning',
								});
							}
						},
						error: function(res) {
							foxui.message({
								text: '操作失败',
								type: 'warning',
							});
						}
					});
					callback();
				},
			});
		}
	});

	//禁用
	$('.table-footer .disabled-btn').click(function () {
		let $isChecked = $('.foxui-table-td .foxui-checkbox.is-checked'),
				$checkedTr = $isChecked.closest('.foxui-table-tr'),
				len = $isChecked.length,
				idList = [];

		if (len < 1) {
			foxui.message({
				text: '请先选译要禁用的数据！',
				type: 'danger',
			});
		} else {
			foxui.dialog({
				title: '确认',
				content: '您确定要设置选中的所有数据吗？',
				confirmText: '禁用',
				cancelText: '取消',
				buttonType: 'danger',
				buttonSize: 'small',
				confirm: function (callback) {
					// 异步删除数据
					$checkedTr.each(function () {
						let id = $(this).find('.foxui-table-td:nth-child(2)').text();
						idList.push(id);
					});
					$.ajax({
						type: "post",
						url: 'updateStatus',
						dataType: "json",
						data: {
							"idList": JSON.stringify(idList),
							"is_used":0
						},
						success: function(res) {
							if (res.code == 1) {
								foxui.message({
									text: res.msg,
									type: 'success',
								});

								init();
							}else{
								foxui.message({
									text: res.msg,
									type: 'warning',
								});
							}
						},
						error: function(res) {
							foxui.message({
								text: '操作失败',
								type: 'warning',
							});
						}
					});
					callback();
				},
			});
		}
	});

</script>

<script>
	//关联数据
	function associateData(id) {
		let contentHtmlArr = [];
		$.ajax({
			type: "post",
			url: 'associateData',
			dataType: "json",
			data: {id},
			async: false,
			success: function(res) {
				if (res.code == 1) {
					let dataList = res.data;
					dataList.forEach(item => {
						contentHtmlArr.push(`
							<li class="foxui-table-tr" data-tagId="${id}">
								<div class="foxui-table-td" style="flex: initial; width: 40px">
									<div class="foxui-checkbox">
										<span class="foxui-checkbox-input">
											<i class="foxui-checkbox-icon"></i>
											<input type="checkbox" value=""/>
										</span>
									</div>
								</div>
								<div class="foxui-table-td" style="flex: initial; width: 40px">${item.id}</div>
								<div class="foxui-table-td" style="flex: initial; width: 50%">${item.title}</div>
								<div class="foxui-table-td blue-color">${item.column}</div>
								<div class="foxui-table-td">${item.model_name}</div>
								<div class="foxui-table-td">
									<button class="foxui-text-primary foxui-size-medium" id="${item.id}"  data-model="${item.model}" onclick="cancelAssociate(this)">取消关联</button>
								</div>
							</li>
						`);
					});
				}
			},
			error: function(res) {
			}
		});
		let content =`
				<div class="foxui-table foxui-table-border-bottom foxui-table-hover foxui-checkbox-group associate-table">

				<ul class="foxui-table-thead foxui-checkbox-head">
				<li class="foxui-table-tr">
				<div class="foxui-table-th" style="flex: initial; width: 40px">
				<div class="foxui-checkbox foxui-checkbox-all">
				<span class="foxui-checkbox-input">
				<i class="foxui-checkbox-icon"></i>
				<input type="checkbox" value="" />
				</span>
				</div>
				</div>
				<div class="foxui-table-th" style="flex: initial; width: 40px">ID</div>
				<div class="foxui-table-th" style="flex: initial; width: 50%">标题</div>
				<div class="foxui-table-th">所属栏目</div>
				<div class="foxui-table-th">所属模型</div>
				<div class="foxui-table-th">操作</div>
				</li>
				</ul>

				<ul class="foxui-table-tbody foxui-checkbox-list">
				<!--表格内容-->
				${contentHtmlArr.join('')}
				</ul>

				<div class="table-footer foxui-checkbox-head">
				<div class="left display-flex foxui-align-items-center">
				<div class="foxui-checkbox foxui-checkbox-all margin-right-24">
				<span class="foxui-checkbox-input">
				<i class="foxui-checkbox-icon"></i>
				<input type="checkbox" value="" />
				</span>
				</div>

				<div class="display-flex">
				<button class="foxui-plain-info foxui-size-mini cancel-btn">
				<i class="foxui-icon-zhengque-o"></i>
				<span>取消关联</span>
				</button>
				</div>
				</div>
				</div>
				</div>
				`
		;
		foxui.dialog({
			title: '关联列表',
			content: content,
			width: '920px',
		});

	}
	//取消关联
	function cancelAssociate(obj) {
		foxui.dialog({
			title: '取消关联',
			content: '您确定要取消选中的关联吗？',
			confirmText: '确定',
			cancelText: '取消',
			buttonType: 'danger',
			buttonSize: 'small',
			confirm: function (callback) {
				let id = $(obj).attr("id");
				let model = $(obj).attr("data-model");
				let tr = $(obj).closest('.foxui-table-tr');
				let tagId = $(tr).attr("data-tagId");
				$.ajax({
					type: "post",
					url: 'cancelAssociate',
					dataType: "json",
					data: {id,model,tagId},
					async: false,
					success: function(res) {
						if (res.code == 1) {
							$(tr).slideUp();
						}else{
							foxui.message({
								text: res.msg,
								type: 'warning', // warning, danger, success, info
							});
						}
					},
					error: function(res) {
						foxui.message({
							text: res.responseJSON.msg,
							type: 'warning', // warning, danger, success, info
						});
					}
				});
				callback();
			}
		})
	}

	//批量取消
	$(document).on('click', '.associate-table .cancel-btn', function () {
		let $isChecked = $('.associate-table .foxui-table-td .foxui-checkbox.is-checked'),
				$checkedTr = $isChecked.closest('.foxui-table-tr'),
				len = $isChecked.length,
				associateList = [];
		if (len < 1) {
			foxui.message({
				text: '请先选译要取消的关联！',
				type: 'danger',
			});
		} else {
			foxui.dialog({
				title: '取消关联',
				content: '您确定要取消选中关联的所有数据吗？',
				confirmText: '确认',
				cancelText: '取消',
				buttonType: 'danger',
				buttonSize: 'small',
				confirm: function (callback) {
					// 异步删除数据
					$checkedTr.each(function () {
						let tagId = $(this).attr('data-tagId');
						let model = $(this).find('button').attr("data-model");
						let id = $(this).find('.foxui-table-td:nth-child(2)').text();
						associateList.push({id, tagId, model});
					});
					$.ajax({
						type: "post",
						url: 'cancelAssociates',
						dataType: "json",
						data: {
							"associateList": JSON.stringify(associateList)
						},
						success: function(res) {
							if (res.code == 1) {
								$checkedTr.each(function () {
									$(this).slideUp();
								});
							}else {
								foxui.message({
									text: res.msg,
									type: 'warning', // warning, danger, success, info
								});
							}
						},
						error: function(res) {
							foxui.message({
								text: res.responseJSON.msg,
								type: 'warning', // warning, danger, success, info
							});
						}
					});
					callback();
				}
			});
		}
	});
</script>

{/block}
