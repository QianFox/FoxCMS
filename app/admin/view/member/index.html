{extend name="foxcms" /}

{block name="css"}
{/block}

{block name="body"}
<input name="bcid" value="{$bcid}" type="hidden" />
<input id="tableItemStr" value="{$tableItemStr}" type="hidden" />
<div class="foxcms-content-inner">
	<!-- page content -->
	<div class="diy-form-content">
		<div class="content-top-operation">
			<div class="left">
				<a href="{:url('add')}?type=1&columnId={$clickId}">
					<button class="foxui-size-small foxui-solid-primary">
						<i class="foxui-icon-jiahao-o"></i>
						<span>新增会员</span>
					</button>
				</a>
			</div>
			<div class="right display-flex">
				<div class="foxui-input-group item-input margin-right-20">
					<div class="foxui-input-prepend">
						<input class="foxui-size-small" placeholder="请输入关键字" required value="" name="keyword"/>
					</div>
				</div>
				<button class="foxui-solid-primary foxui-size-small search-btn">搜索</button>
			</div>
		</div>
		<div class="section section-panel margin-top-10">
			<div class="foxui-table foxui-table-border-bottom foxui-table-hover foxui-checkbox-group">

				<ul class="foxui-table-thead foxui-checkbox-head">
					<li class="foxui-table-tr">
						<div class="foxui-table-th" style="flex: initial; width: 40px">
							<div class="foxui-checkbox foxui-checkbox-all">
                                <span class="foxui-checkbox-input">
                                    <i class="foxui-checkbox-icon"></i>
                                    <input type="checkbox" value="" />
                                </span>
							</div>
						</div>
						<div class="foxui-table-th">ID</div>
						<div class="foxui-table-th">昵称</div>
						{foreach $tableHeads as $key=>$vo }
						<div class="foxui-table-th">{$vo.title}</div>
						{/foreach}
						<div class="foxui-table-th">操作</div>
					</li>
				</ul>

				<ul class="foxui-table-tbody foxui-checkbox-list loading-container" id="loadingContainer">

					<!--表格内容-->

				</ul>

				<div class="table-footer foxui-checkbox-head">
					<div class="left display-flex foxui-align-items-center">
						<div class="foxui-checkbox foxui-checkbox-all margin-right-24">
                            <span class="foxui-checkbox-input">
                                <i class="foxui-checkbox-icon"></i>
                                <input type="checkbox" value="" />
                            </span>
						</div>

						<div class="display-flex">
							<button class="foxui-plain-info foxui-size-mini delete-btn">
								<i class="foxui-icon-shanchu-o"></i>
								<span>删除</span>
							</button>
						</div>
					</div>
					<div class="right total">共N条记录</div>
				</div>
			</div>

		</div>
	</div>
</div>

{include file="footed-copy"/}
{/block}


{block name="js"}
<script>

	/**
	 * 初始化数据
	 */
	function init(){
		let keyword = $('input[name="keyword"]').val();
		let bcid = $("input[name='bcid']").val()
		let searchData = {
			"keyword": keyword,
			"bcid": bcid
		};

		$.ajax({
			type: "post",
			url: "index",
			dataType: "json",
			data: searchData,
			success: function (res) {
				if (res.code == 1 && res.data) {
					let data = res.data;
					let paginationData = {
						pageSize: data.per_page,
						total: data.total,
						currentPage: data.current_page
					};
					initTable(paginationData, data.data);
				}
				$('#loadingContainer').removeClass('loading-container');
			}, error: function (res) {
				$('#loadingContainer').removeClass('loading-container');
			}
		});
	}

	/**
	 * @description: 初始化表格
	 * @param {*} pageSize
	 * @param {*} total
	 * @param {*} currentPage
	 * @param {*} dataList
	 * @return {*}
	 * @Date: 2022-01-12 10:55:11
	 */
	function initTable({ pageSize, total, currentPage }, dataList) {
		if (dataList == undefined){
			dataList = [];
		}
		if(total == undefined){
			total = 0;
		}
		if (dataList == undefined){
			dataList = [];
		}
		if(total == undefined){
			total = 0;
		}
		// 追加表格 html
		_appendToTable(dataList);
		//总数
		$(".right.total").empty().html("共" + total + "条记录");
	}

	/**
	 * @description: 追加表格 html
	 * @param {*} dataList
	 * @return {*}
	 * @Date: 2022-01-12 00:18:40
	 */
	function _appendToTable(dataList) {
		const html = _trsHtml(dataList);
		$('.foxui-table-tbody').empty().append(html);
	}

	/**
	 * @description: 表格 html
	 * @param {*} dataList
	 * @return {*}
	 * @Date: 2022-01-12 00:18:52
	 */
	function _trsHtml(dataList) {
		let htmlArr = [];
		let tableItemStr = $("#tableItemStr").val();
		let tableItem = [];//表项
		if(tableItemStr.length > 0){
			tableItem = tableItemStr.split(",");
		}
		dataList.forEach(item => {
			let fieldHtml = [];//拼装字段值
			$.each (tableItem, function(k,v){
				if(v != "id" && v != 'nickname' && v != 'avatarUrl'){
					fieldHtml.push(`<div class="foxui-table-td">${item[v]}</div>`);
				}
			})
			htmlArr.push(`
            <li class="foxui-table-tr">
                <div class="foxui-table-td" style="flex: initial; width: 40px">
                    <div class="foxui-checkbox">
                        <span class="foxui-checkbox-input">
                            <i class="foxui-checkbox-icon"></i>
                            <input type="checkbox" value="" />
                        </span>
                    </div>
                </div>
                <div class="foxui-table-td" nid="${item.nid}">${item.id}</div>
                <div class="foxui-table-td" nid="${item.nid}">
					${item.avatar ? '<img class="foxui-margin-right-8 foxui-border foxui-radius-base" src="'+ item.avatar +'" style="width:40px; height:40px;"/>': ''} ${item.nickname}
				</div>
				${fieldHtml.join("")}
                <div class="foxui-table-td">
                    <button class="foxui-text-primary foxui-size-medium edit-btn"  id="${item.id}" nid="${item.nid}" onclick="editItem(event)">编辑</button>
                    <button class="foxui-text-primary foxui-size-medium delete-btn" id="${item.id}" title="${item.nickname}" nid="${item.nid}" onclick="deleteItem(event)">删除</button>
                    <button class="foxui-text-primary foxui-size-medium delete-btn" id="${item.id}" nid="${item.nid}" onclick="detailItem(event)">详情</button>
                </div>
            </li>
        `);
		});
		return htmlArr.join('');
	}

	init();

	//搜索
	$(".search-btn").on('click', function() {
		$('#loadingContainer').addClass('loading-container');
		init();
	});

	//编辑
	function editItem(event){
		let obj = $(event.target);
		let isBtn = $(obj).is('button');//判断是否为button标签
		if(!isBtn){
			obj = $(obj).parent('button');
		}
		let id = $(obj).attr("id");
		let nid = $(obj).attr("nid");
		window.location.href='edit?id=' + id  + '&columnId={$cid}&type=1' + '&nid='+ nid;
	}

	//详情
	function detailItem(event){
		let obj = $(event.target);
		let isBtn = $(obj).is('button');//判断是否为button标签
		if(!isBtn){
			obj = $(obj).parent('button');
		}
		let id = $(obj).attr("id");
		let nid = $(obj).attr("nid");
		window.location.href='detail?id=' + id  + '&columnId={$cid}&type=1' + '&nid='+ nid;
	}

	//单向删除
	function deleteItem(event) {
		let obj = $(event.target);
		let isBtn = $(obj).is('button');//判断是否为button标签
		if(!isBtn){
			obj = $(obj).parent('button');
		}
		let title = $(obj).attr("title");
		let id = $(obj).attr("id");
		let nid = $(obj).attr("nid");
		foxui.dialog({
			title: '删除',
			content: '您确定要删除【' + title + '】吗',
			cancelText: '取消',
			confirmText: '删除',
			buttonType: 'danger',
			confirm: function(callback) {
				foxui.closeLoading();
				$.ajax({
					type: "get",
					url: 'delete?id=' + id + "&nid="+nid,
					dataType: "json",
					success: function(res) {
						foxui.closeLoading();
						if (res.code == 1) {
							foxui.message({
								text: res.msg,
								type: 'success',
							});
							init();
						} else {
							foxui.message({
								text: res.msg,
								type: 'error',
							});
						}
					},
					error: function(res) {
						foxui.closeLoading();
						foxui.message({
							text: res.msg,
							type: 'info',
						});
					}
				});
				callback();
			},
			cancel: function() {
				foxui.message({
					text: '取消删除',
					type: 'info'
				});
			},
		});

	}

	// 多选删除
	$('.table-footer .delete-btn').click(function () {
		let $isChecked = $('.foxui-table-td .foxui-checkbox.is-checked'),
				$checkedTr = $isChecked.closest('.foxui-table-tr'),
				len = $isChecked.length,
				idList = [],nidList=[];

		if (len < 1) {
			foxui.message({
				text: '请先选译要删除的数据！',
				type: 'danger',
			});
		} else {
			foxui.dialog({
				title: '确认',
				content: '您确定要删除选中的所有数据吗？',
				confirmText: '删除',
				cancelText: '取消',
				buttonType: 'danger',
				buttonSize: 'small',
				confirm: function (callback) {
					// 异步删除数据
					$checkedTr.each(function () {
						let id = $(this).find('.foxui-table-td:nth-child(2)').text();
						let nid = $(this).find('.foxui-table-td:nth-child(2)').attr("nid");
						nidList.push(nid);
						idList.push(id);
					});
					$.ajax({
						type: "post",
						url: 'deletes',
						dataType: "json",
						data: {
							"idList": JSON.stringify(idList),
							"nidList": JSON.stringify(nidList)
						},
						success: function(res) {
							if (res.code == 1) {
								foxui.message({
									text: res.msg,
									type: 'success',
								});

								init();
							}else{
								foxui.message({
									text: res.msg,
									type: 'warning',
								});
							}
						},
						error: function(res) {
							foxui.message({
								text: res.responseJSON.msg,
								type: 'warning',
							});
						}
					});
					callback();
				},
			});
		}
	});
</script>

{/block}
